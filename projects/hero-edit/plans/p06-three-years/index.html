<script>
  const V = OM.vars();
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });

  const CUT = [
    ['s0', 0.0, 2.5],
    ['s1', 2.5, 1.0],
    ['s2', 3.5, 2.0],
    ['s3', 9.5, 1.5],
    ['s4', 11.0, 4.0]
  ];
  const SPIRAL = [
    
  ];
  const SPIRAL_END = 0.0;
  const FX = [            // grid cells: [id, appears, gone]
    
  ];
  const FLASHES = [];
  const SPINS = [         // grid spirals into the full clip: [grid wrapper, shot, at, duration]
    
  ];
  const SPIN_SHOTS = SPINS.map(s => s[1]);
  const MIRRORS = [       // mirrored right half: [id, shown, gone, punch time of the shot it copies]
    
  ];
  const IMPACTS = [       // impact frames: [id, on, off] (one frame each)
    ['fx0i0', 0.0, 0.0293],
    ['fx0i1', 0.0293, 0.0627],
    ['fx0i2', 0.0627, 0.096],
    ['fx0i3', 0.096, 0.1293]
  ];
  const SHAKES = [        // screen shake after the impact: [shot, at, duration]
    ['s0', 0.1333, 0.3]
  ];
  const STACKS = [        // photo stack: [background, at, end, [[print, drop, rotation, dx, dy], ...]]
    ['fx1bg', 5.5, 9.5, [['fx1p0', 5.5, -6.6, -32, 2], ['fx1p1', 5.956, -6.9, 17, 30], ['fx1p2', 6.412, 2.7, -14, -18], ['fx1p3', 6.868, -0.2, 9, 25], ['fx1p4', 7.324, 1.9, -40, 27], ['fx1p5', 7.78, -4.2, -11, 45], ['fx1p6', 8.236, 8.0, 0, -27], ['fx1p7', 8.692, -8.6, 29, -29]]]
  ];
  const IRISES = [        // circular reveal: [shot, at, duration, x %, y %]
    
  ];
  const TITLES = [
    ['t0', 0.3, 1.94],
    ['t1', 1.94, 4.04],
    ['t2', 4.04, 5.36],
    ['t3', 5.36, 7.0],
    ['t4', 7.0, 9.1],
    ['t5', 11.1, 15.0],
    ['t6', 11.78, 15.0]
  ];
  const END = 11.0;

  // opening spiral: every clip flashes by, turning and zooming, easing into the hook shot
  SPIRAL.forEach(([id, at, dur, angle, scale], i) => {
    const el = '#' + id;
    const next = SPIRAL[i + 1];
    tl.set(el, { visibility: 'visible', rotation: angle, scale: scale }, at)
      .to(el, { rotation: next ? next[3] : 0, scale: next ? next[4] : 1.04, duration: dur, ease: 'none' }, at)
      .set(el, { visibility: 'hidden' }, at + dur);
  });

  // grid framework: cells pop in (crop to grid / fit to grid / crop flash), then the full shot takes over
  FX.forEach(([id, at, gone]) => {
    const el = '#' + id;
    tl.set(el, { visibility: 'visible' }, at)
      .fromTo(el, { scale: 1.06 }, { scale: 1, duration: .2, ease: 'expo.out' }, at)
      .set(el, { visibility: 'hidden' }, gone);
  });
  // the full grid circles and spirals down into the centre while the full clip spirals out of it
  SPINS.forEach(([wrap, shot, at, dur]) => {
    tl.to('#' + wrap, { rotation: 300, scale: .04, duration: dur * .8, ease: 'power2.in' }, at);
    tl.set('#' + shot, { visibility: 'visible', rotation: -240, scale: .04 }, at + dur * .25)
      .to('#' + shot, { rotation: 0, scale: 1, duration: dur, ease: 'power3.out' }, at + dur * .25);
  });
  // mirror: the right half shows the left half flipped, moving with the shot underneath
  MIRRORS.forEach(([id, shown, gone, punch]) => {
    tl.set('#' + id, { visibility: 'visible' }, shown)
      .fromTo('#' + id, { scale: 1.06 }, { scale: 1, duration: .5, ease: 'expo.out', immediateRender: false }, punch)
      .set('#' + id, { visibility: 'hidden' }, gone);
  });
  // impact frames: stark single frames, then the shot snaps back with a short shake
  IMPACTS.forEach(([id, on, off]) => tl.set('#' + id, { visibility: 'visible' }, on).set('#' + id, { visibility: 'hidden' }, off));
  SHAKES.forEach(([id, at, dur]) => {
    const xs = [18, -15, 11, -8, 5, -2, 0], step = dur / xs.length;
    xs.forEach((x, k) => tl.to('#' + id, { x, duration: step, ease: 'none' }, at + k * step));
  });
  // photo stack: prints drop in and pile up; the top print sweeps up and away into the next shot
  STACKS.forEach(([bg, at, end, cards]) => {
    tl.set('#' + bg, { visibility: 'visible' }, at).set('#' + bg, { visibility: 'hidden' }, end);
    cards.forEach(([id, drop, r, dx, dy], k) => {
      tl.set('#' + id, { visibility: 'visible' }, drop)
        .fromTo('#' + id, { opacity: 0, scale: 1.35, rotation: r + 12, x: dx, y: dy - 160 },
                { opacity: 1, scale: 1, rotation: r, x: dx, y: dy, duration: .32, ease: 'power3.out' }, drop)
        .set('#' + id, { visibility: 'hidden' }, end);
      if (k === cards.length - 1)
        tl.to('#' + id, { scale: 2.6, rotation: 0, x: 0, y: 0, opacity: 0, duration: .32, ease: 'power2.in' }, end - .32);
    });
  });
  // iris: the shot opens out of a growing circle over the shot before it
  IRISES.forEach(([id, at, dur, x, y]) => {
    tl.set('#' + id, { clipPath: `circle(0% at ${x}% ${y}%)` }, at)
      .to('#' + id, { clipPath: `circle(125% at ${x}% ${y}%)`, duration: dur, ease: 'power2.inOut' }, at)
      .set('#' + id, { clipPath: 'none' }, at + dur);
  });
  // flash: two frames of white on a grid transition, kept subtle
  FLASHES.forEach((at) => tl.fromTo('#flash', { opacity: .55 }, { opacity: 0, duration: 2 / 30, ease: 'none', immediateRender: false }, at));

  // shots: a slow push-in for the long holds, a harder punch for the quick ones
  CUT.forEach(([id, at, dur]) => {
    const el = '#' + id;
    if (SPIRAL.length && at === 0) at = SPIRAL_END, dur -= SPIRAL_END;   // the hook shot lands out of the spiral
    const quick = dur <= .5;
    if (SPIN_SHOTS.includes(id)) {     // arrives by spiralling out of the grid (see SPINS)
      tl.set(el, { visibility: 'hidden' }, at + dur);
      return;
    }
    tl.set(el, { visibility: 'visible' }, at)
      .fromTo(el, { scale: quick ? 1.14 : 1.06 }, { scale: quick ? 1.04 : 1.0, duration: Math.min(.5, dur), ease: 'expo.out' }, at)
      .set(el, { visibility: 'hidden' }, at + dur);
    const isLast = id === CUT[CUT.length - 1][0];  // the linger has its own slow push
    if (dur > .5 && !isLast) tl.to(el, { scale: 1.05, duration: dur - .5, ease: 'none' }, at + .5);
  });


  // captions: each word writes itself out letter by letter at speaking pace, the chunk holds, then clears
  const LETTER_FADE = 0.25;   // each letter's fade-in
  const WRITE_SHARE = 1.0;   // letters are spread over this share of the word's spoken time
  TITLES.forEach(([id, at, out]) => {
    const el = document.getElementById(id);
    tl.set(el, { visibility: 'visible' }, at).set(el, { visibility: 'hidden' }, out);
    el.querySelectorAll('.w').forEach((w, i) => {
      const start = at + parseFloat(w.dataset.t ?? i * 0.14);
      const ls = w.querySelectorAll('.l');
      const step = ls.length > 1 ? parseFloat(w.dataset.d || .4) * WRITE_SHARE / ls.length : 0;
      ls.forEach((l, j) => tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: LETTER_FADE, ease: 'sine.out' }, start + j * step));
    });
    tl.to(el, { opacity: 0, duration: .15, ease: 'none' }, out - .15);
  });

  // linger: a slower push on the open landscape, then a soft fade to black over the last 0.8 s
  tl.addLabel('scene:linger', END);
  tl.to('#' + CUT[CUT.length - 1][0], { scale: 1.1, duration: 4.0 - .5, ease: 'sine.inOut' }, END + .5);
  tl.to('#fade', { opacity: 1, duration: 0.6, ease: 'sine.in' }, END + 4.0 - 0.6);
  tl.to({}, { duration: 4.0 }, END);

  window.__timelines['film'] = tl;
</script>
