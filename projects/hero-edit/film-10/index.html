<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"name","type":"string","label":"Name","default":"JAMES LEAHY"},
  {"id":"accent","type":"color","label":"Accent","default":"#75ff78"},
  {"id":"ink","type":"color","label":"Text","default":"#ffffff"}
]'>
<head>
<meta charset="utf-8">
<title>Hero edit — 10 s</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style id="om-fonts">
@font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Bebas Neue"; src: url("assets/fonts/BebasNeue.woff2") format("woff2"); font-weight: 400; font-style: normal; }
</style>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: var(--ink); font-family: "Outfit", sans-serif; --shadow: 4px 6px 0 rgba(0,0,0,.28), 6px 8px 12px rgba(0,0,0,.35); --cherry: #D2042D; }
  .shot { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  /* clips are ungraded (straight HDR to SDR conversion) */
  .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.12) 22%, rgba(0,0,0,0) 34%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35) 100%); }
  .t { position: absolute; left: 0; right: 0; text-align: center; font-family: "Bebas Neue", sans-serif; font-weight: 400; line-height: .95; letter-spacing: .01em; text-transform: uppercase; -webkit-text-stroke: 3px currentColor; opacity: 0; text-shadow: var(--shadow); }
  .xl { font-size: 180px; } .l { font-size: 130px; } .m { font-size: 96px; } .s { font-size: 68px; }
  .big { font-size: 200px; }
  .h { font-size: 112px; line-height: .98; }
  /* green words: bold green with a thin cherry outline, then the subtle down-right shadow */
  .acc { color: var(--accent); text-shadow: none;
    filter: drop-shadow(2.5px 0 0 var(--cherry)) drop-shadow(-2.5px 0 0 var(--cherry)) drop-shadow(0 2.5px 0 var(--cherry)) drop-shadow(0 -2.5px 0 var(--cherry))
            drop-shadow(4px 6px 0 rgba(0,0,0,.28)) drop-shadow(6px 8px 12px rgba(0,0,0,.35)); }
  .cap { white-space: nowrap; opacity: 1; visibility: hidden; }
  .cap .w { display: inline-block; opacity: 0; }
  .kick { position: absolute; left: 0; right: 0; text-align: center; font-family: "Outfit"; font-weight: 500; font-size: 36px; letter-spacing: 13px; text-transform: uppercase; text-shadow: var(--shadow); opacity: 0; }
  .bar { position: absolute; left: 50%; width: 420px; height: 6px; margin-left: -210px; box-shadow: 4px 6px 10px rgba(0,0,0,.35); background: var(--accent); transform: scaleX(0); }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="1080" data-height="1920" data-om-signature="off">
  <!-- no soundtrack: music is added afterwards. Cuts sit on a 0.5 s grid (120 BPM, or 60 BPM half-time) -->
  <div class="shot" id="s0" style="visibility:visible" data-om-id="shot-0170"><video src="assets/clips/0170.mp4" class="clip" data-start="0.0" data-duration="2.0" data-media-start="1.8" muted playsinline></video></div>
  <div class="shot" id="s1" data-om-id="shot-8230"><video src="assets/clips/8230.mp4" class="clip" data-start="2.0" data-duration="0.5" data-media-start="3.6" muted playsinline></video></div>
  <div class="shot" id="s2" data-om-id="shot-2524"><video src="assets/clips/2524.mp4" class="clip" data-start="2.5" data-duration="1.0" data-media-start="1.5" muted playsinline></video></div>
  <div class="shot" id="s3" data-om-id="shot-0171"><video src="assets/clips/0171.mp4" class="clip" data-start="3.5" data-duration="0.5" data-media-start="15.5" muted playsinline></video></div>
  <div class="shot" id="s4" data-om-id="shot-7989"><video src="assets/clips/7989.mp4" class="clip" data-start="4.0" data-duration="0.5" data-media-start="3.4" muted playsinline></video></div>
  <div class="shot" id="s5" data-om-id="shot-9161"><video src="assets/clips/9161.mp4" class="clip" data-start="4.5" data-duration="0.5" data-media-start="1.2" muted playsinline></video></div>
  <div class="shot" id="s6" data-om-id="shot-9170"><video src="assets/clips/9170.mp4" class="clip" data-start="5.0" data-duration="0.5" data-media-start="0.6" muted playsinline></video></div>
  <div class="shot" id="s7" data-om-id="shot-9319"><video src="assets/clips/9319.mp4" class="clip" data-start="5.5" data-duration="0.5" data-media-start="2.5" muted playsinline></video></div>
  <div class="shot" id="s8" data-om-id="shot-9661_slow"><video src="assets/clips/9661_slow.mp4" class="clip" data-start="6.0" data-duration="1.5" data-media-start="4.6" muted playsinline></video></div>
  <div class="shot" id="s9" data-om-id="shot-2153"><video src="assets/clips/2153.mp4" class="clip" data-start="7.5" data-duration="1.0" data-media-start="4.2" muted playsinline></video></div>
  <div class="shot endshot" id="s10" data-om-id="shot-2148"><video src="assets/clips/2148.mp4" class="clip" data-start="8.5" data-duration="1.5" data-media-start="0.9" muted playsinline></video></div>

  <div class="shade"></div>

  <div class="t h cap" id="t0" style="top:250px" data-om-id="caption-0"><span class="w">Your</span> <span class="w">comfort</span> <span class="w">zone</span></div>
  <div class="t h cap" id="t1" style="top:250px" data-om-id="caption-1"><span class="w">can</span> <span class="w">quietly</span> <span class="w">become</span></div>
  <div class="t h cap" id="t2" style="top:250px" data-om-id="caption-2"><span class="w">the</span> <span class="w">most</span></div>
  <div class="t h cap" id="t3" style="top:250px" data-om-id="caption-3"><span class="w acc">expensive</span> <span class="w">place</span></div>
  <div class="t h cap" id="t4" style="top:1130px" data-om-id="caption-4"><span class="w">you</span> <span class="w">ever</span> <span class="w">live.</span></div>

  <!-- linger: no name card; the last shot fades to black -->
  <div id="fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none"></div>

</div>

<script>
  const V = OM.vars();
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });

  const CUT = [
    ['s0', 0.0, 2.0],
    ['s1', 2.0, 0.5],
    ['s2', 2.5, 1.0],
    ['s3', 3.5, 0.5],
    ['s4', 4.0, 0.5],
    ['s5', 4.5, 0.5],
    ['s6', 5.0, 0.5],
    ['s7', 5.5, 0.5],
    ['s8', 6.0, 1.5],
    ['s9', 7.5, 1.0],
    ['s10', 8.5, 1.5]
  ];
  const TITLES = [
    ['t0', 0.3, 1.77],
    ['t1', 1.87, 3.34],
    ['t2', 3.44, 4.49],
    ['t3', 4.59, 5.64],
    ['t4', 5.74, 7.21]
  ];
  const END = 8.5;

  // shots: a slow push-in for the long holds, a harder punch for the quick ones
  CUT.forEach(([id, at, dur]) => {
    const el = '#' + id;
    const quick = dur <= .5;
    tl.set(el, { visibility: 'visible' }, at)
      .fromTo(el, { scale: quick ? 1.14 : 1.06 }, { scale: quick ? 1.04 : 1.0, duration: Math.min(.5, dur), ease: 'expo.out' }, at)
      .set(el, { visibility: 'hidden' }, at + dur);
    const isLast = id === CUT[CUT.length - 1][0];  // the linger has its own slow push
    if (dur > .5 && !isLast) tl.to(el, { scale: 1.05, duration: dur - .5, ease: 'none' }, at + .5);
  });


  // captions: words pop in one at a time, the chunk holds for reading time, then clears
  TITLES.forEach(([id, at, out]) => {
    const el = document.getElementById(id);
    tl.set(el, { visibility: 'visible' }, at).set(el, { visibility: 'hidden' }, out);
    el.querySelectorAll('.w').forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, y: 18, scale: 1.18 }, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2)' }, at + i * 0.14);
    });
    tl.to(el, { opacity: 0, duration: .15, ease: 'none' }, out - .15);
  });

  // linger: a slower push on the open landscape, then a soft fade to black over the last 0.8 s
  tl.addLabel('scene:linger', END);
  tl.to('#' + CUT[CUT.length - 1][0], { scale: 1.1, duration: 1.5 - .5, ease: 'sine.inOut' }, END + .5);
  tl.to('#fade', { opacity: 1, duration: .8, ease: 'sine.in' }, END + 1.5 - .8);
  tl.to({}, { duration: 1.5 }, END);

  window.__timelines['film'] = tl;
</script>
</body>
</html>
